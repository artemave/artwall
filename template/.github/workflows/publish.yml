name: Publish gallery

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a second push while one is running replaces it rather
# than queuing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # Already built by artwall's `--publish-stars` before this was
          # pushed — self-contained, so there is nothing to build here.
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
